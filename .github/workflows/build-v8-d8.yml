name: Build V8 d8 (Linux x64)

on:
  workflow_dispatch:  # 允许你在 GitHub Actions 页面手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. 安装 Google 的 depot_tools，并添加到 PATH
      - name: Install depot_tools
        run: |
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git
          echo "$(pwd)/depot_tools" >> $GITHUB_PATH

      # 2. 下载 V8 源码（稳定的 branch-heads/14.8）
      - name: Fetch V8 source
        run: |
          mkdir v8 && cd v8
          fetch v8
          cd v8
          git checkout branch-heads/14.8
          gclient sync -D  # -D 删除不需要的依赖

      # 3. 生成构建规则，只编译 d8
      - name: Build d8 only
        run: |
          cd v8/v8
          gn gen out/x64.release --args='is_debug=false target_cpu="x64"'
          ninja -C out/x64.release d8

      # 4. 上传编译产物 d8
      - name: Upload d8 binary
        uses: actions/upload-artifact@v4
        with:
          name: d8-linux-x64
          path: v8/v8/out/x64.release/d8
