name: Build V8 d8 (Windows x64)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    env:
      DEPOT_TOOLS_WIN_TOOLCHAIN: 0   # 关键：让 depot_tools 使用本地 VS 工具链
    steps:
      # (1) 下载 Google 的 depot_tools
      - name: Install depot_tools
        run: |
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git ${{ github.workspace }}/depot_tools
          echo "${{ github.workspace }}/depot_tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # (2) 拉取 V8 稳定版源码
      - name: Fetch V8 source
        run: |
          mkdir v8
          cd v8
          cmd /c "fetch v8"
          cd v8
          git checkout branch-heads/14.8
          gclient sync -D --force

      # (3) 只编译 d8
      - name: Build d8 only
        run: |
          cd v8/v8
          mkdir out\x64.release -Force
          "is_debug = false" | Out-File -Encoding ascii out\x64.release\args.gn
          "target_cpu = `"x64`"" | Out-File -Encoding ascii -Append out\x64.release\args.gn
          gn gen out/x64.release
          ninja -j 2 -C out/x64.release d8

      # (4) 上传 Windows 版 d8
      - name: Upload d8.exe
        uses: actions/upload-artifact@v4
        with:
          name: d8-windows-x64
          path: v8/v8/out/x64.release/d8.exe
